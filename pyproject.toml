[project]
name = "braintumor"
version = "0.3.0"
description = "Brain MRI tumour segmentation, physical measurement and 3D reconstruction (research prototype)"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "torch", "monai", "nibabel", "scikit-image", "trimesh", "pydicom",
  "pyyaml", "pandas", "matplotlib", "PyQt6", "pyvista", "pyvistaqt", "qtpy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p braintumor._preload"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["gui: needs a Qt display (run on a real desktop session)", "slow: takes more than ~20 s on CPU"]
